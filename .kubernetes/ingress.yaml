apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: enki
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "7200"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "7200"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "7200"
    nginx.ingress.kubernetes.io/proxy-body-size: 30m
    nginx.ingress.kubernetes.io/proxy-buffer-size: 256k
    nginx.ingress.kubernetes.io/proxy-buffering: 'on'
    nginx.ingress.kubernetes.io/proxy-buffers-number: '4'
    cert-manager.io/issuer: "letsencrypt-production"
    # Long-cache only unhashed static assets. The app owns Cache-Control for
    # everything else (SSR pages set no-cache, /sitemap.xml sets max-age=3600,
    # and /_app/immutable assets are served with a 1 year immutable header).
    nginx.ingress.kubernetes.io/configuration-snippet: |
      # Redirect the www host to the apex at the edge, before it reaches the
      # app. This also covers static assets, which bypass the app's handle hook.
      if ($host = "www.enkionline.com") {
        return 301 https://enkionline.com$request_uri;
      }
      if ($uri ~* "^/(?!_app/).*\.(woff2?|ttf|otf|eot|png|jpe?g|avif|webp|svg|ico|pdf|css|js)$") {
        more_set_headers "Cache-Control: public, max-age=7889400";
      }
      # Extensionless paths are pages (prerendered HTML bypasses the app hook).
      if ($uri !~ "\.") {
        more_set_headers "Cache-Control: no-cache";
      }
spec:
  tls:
   - secretName: enki-website-production
     hosts:
       - enkionline.com
       - www.enkionline.com
       - e2e-test.enkionline.com
  rules:
    - host: enkionline.com
      http:
        paths:
          - path: /*
            pathType: "Prefix"
            backend:
              service:
                name: enki-website
                port:
                  number: 5000
    - host: www.enkionline.com
      http:
        paths:
          - path: /*
            pathType: "Prefix"
            backend:
              service:
                name: enki-website
                port:
                  number: 5000
    - host: e2e-test.enkionline.com
      http:
        paths:
          - path: /*
            pathType: "Prefix"
            backend:
              service:
                name: enki-e2e-test-website
                port:
                  number: 5000
